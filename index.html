<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nokia Nostalgia</title>
    <link rel="stylesheet" href="css/resets.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="scripts/main.js" defer></script>
  </head>
  <body class="page-wrapper">
    <main id="app">
      <section id="start-screen">
        <h2>GAME TITLE</h2>
        <div id="rules">
          <h2>RULES</h2>
          <p>
            Here will be the rules Here will be the rules Here will be the rules
            Here will be the rules Here will be the rules Here will be the rules
            Here will be the rules
          </p>
        </div>
        <div id="challenge-wrapper">
          <button id="easy-btn">EASY</button>
          <button id="normal-btn">NORMAL</button>
          <button id="hard-btn">HARD</button>
        </div>
        <div id="play-btn-wrapper">
          <p>Press Enter to start</p>
          <button id="start-game">START!</button>
        </div>
      </section>
      <section id="play-screen">
        <p>High Score: <span id="high-score">-</span></p>
        <p>Score: <span id="score">0</span></p>
        <div class="board"></div>
      </section>

      <section id="end-screen"></section>
    </main>
    <footer id="tag">
      <p>Game made by, <span id="creators">participants...</span></p>
    </footer>
  </body>
</html>
